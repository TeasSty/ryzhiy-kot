<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оформление праздников — Рыжий кот</title>
  <meta name="description" content="Оформление дня рождения, свадьбы, корпоратива и детского праздника воздушными шарами в Новокузнецке.">
  <link rel="icon" href="img/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Marck+Script&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip" href="#content">К содержанию</a>
  <header data-header></header>
  <main id="content" class="desk">
    <img src="img/products/p16134970.jpg" alt="Плотная композиция из розовых и золотых шаров">
    <div class="desk-form">
      <p class="eyebrow">Оформление</p>
      <h1>Праздник под ключ</h1>
      <p>День рождения, свадьба, корпоратив, детский праздник, фотозона или идея, которой ещё нет в каталоге. Напишите дату и место — предложим состав и сумму.</p>
      <form class="form-grid" data-order>
        <label class="field">Имя
          <input name="name" required autocomplete="name">
        </label>
        <label class="field">Телефон
          <input name="phone" required autocomplete="tel" placeholder="8 913 000-00-00">
        </label>
        <label class="field">Дата праздника
          <input name="date" type="date" required>
        </label>
        <label class="field">Что оформляем
          <select name="kind">
            <option>День рождения</option>
            <option>Свадьба</option>
            <option>Детский праздник</option>
            <option>Выписка</option>
            <option>Выпускной</option>
            <option>Корпоратив</option>
            <option>Фотозона</option>
            <option>Другое</option>
          </select>
        </label>
        <label class="field">Место
          <input name="place" placeholder="дом, ресторан, зал">
        </label>
        <label class="field">Как это должно выглядеть
          <textarea name="comment" placeholder="цвета, цифра, надпись, сколько гостей"></textarea>
        </label>
        <button class="btn" type="submit">Заказать оформление</button>
      </form>
      <p>Заявка откроется в WhatsApp. Можно сразу <a href="https://vk.me/redcat42">написать в VK</a>.</p>
    </div>
  </main>
  <footer data-footer></footer>
  <script src="js/site.js"></script>
</body>
</html>
